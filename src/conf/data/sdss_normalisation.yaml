x_ds:
  dataset_name: "sdss"
  fp: ${meta.data_path}
  type: "spectra"
  augmentations: none #${..augmentations}
  size: 3921

y_catalog:
  catalog_name: "sdss"
  fp: null
  join_method: null
  variables:
    NORM:
      name: "standardised_log10_spectral_normalisation"
      size: 1
      processing_fn: null
  drop_variables: []

loader:
  _target_: wwdc_spectra.data.modules.WWDCDataLoader
  datasets:
    train:
      _target_: wwdc_spectra.data.sdss.SDSS
      split: "train"
      x_ds: ${....x_ds}
      y_catalog: ${....y_catalog}
    val:
      _target_: wwdc_spectra.data.sdss.SDSS
      split: "val"
      x_ds: ${....x_ds}
      y_catalog: ${....y_catalog}
    test:
      _target_: wwdc_spectra.data.sdss.SDSS
      split: "test"
      x_ds: ${....x_ds}
      y_catalog: ${....y_catalog}
  batch_size: 512
  random_state: ${seed}
  shuffle: true
  num_workers: 8
