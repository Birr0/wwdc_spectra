# @package _global_

defaults:
- /data/sdss_z_normalisation
- /trainer/gpu
- /logger/wandb
- /logger/csv
- /paths/default
- /hydra/default
- model
- sweeps
- meta
- _self_

hydra:
  sweeper:
    params:
      ++data.y_catalog.drop_variables: ${....sweeps.drop_variables.0}
      +seed: ${....sweeps.seeds.0}

trainer:
  max_epochs: 100
  log_every_n_steps: 50

# Unique run/checkpoint IDs also when using Hydra's local basic launcher.
run_tag: ${now:%Y%m%d_%H%M%S}
logger:
  wandb:
    id: znorm_${run_tag}_${hydra:job.num}
    name: znorm_seed${seed}_${run_tag}
    tags: [z_and_normalisation, "seed${seed}"]
model_checkpoint:
  filename: znorm_${run_tag}_${hydra:job.num}
  save_last: true
