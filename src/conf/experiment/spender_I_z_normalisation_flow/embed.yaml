# @package _global_
defaults:
  - /data/sdss_z_normalisation
  - /trainer/gpu
  - /logger/wandb
  - /paths/default
  - /hydra/default
  - model
  - sweeps
  - meta
  - _self_

lightning_loader:
  ckpt_path: null # let the code populate this.

splits:
  - train
  - test
  - val

embed_opt:
  - "orig"
  - "cond"
  - "uncond"

paths:
  embed_dir: ${paths.experiment_path}/embeddings/

batch_limit: null

logger:
  wandb:
    mode: offline

data:
  loader:
    shuffle: False

hydra:
  sweeper:
    params:
      ++data.y_catalog.drop_variables: ${....sweeps.drop_variables.0}
      +seed: ${....sweeps.seeds.0}
      +data.loader.datasets.test.return_id: true
      +data.loader.datasets.test.return_pos: true
      +data.loader.datasets.test.return_mask_ratio: true
      +data.loader.datasets.val.return_id: true
      +data.loader.datasets.val.return_pos: true
      +data.loader.datasets.val.return_mask_ratio: true
      +data.loader.datasets.train.return_id: true
      +data.loader.datasets.train.return_pos: true
      +data.loader.datasets.train.return_mask_ratio: true
      +lightning_loader.n_steps: 20
